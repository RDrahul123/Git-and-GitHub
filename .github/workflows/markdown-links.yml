name: Markdown links

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments './**/*.md'
